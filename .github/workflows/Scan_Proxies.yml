name: Scan Proxies

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan-proxies
  cancel-in-progress: true

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Configure Git Identity
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Run Proxies Scan
      run: python Scanner.py
      env:
        CHECK_IRAN: "true"

    - name: Final Commit and Push (safety net)
      if: always()
      run: |
        git add -f proxies/ Raw_Sources/ README.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update live proxies list (final)" && git push)
